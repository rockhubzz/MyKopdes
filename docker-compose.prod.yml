# Production stack: images are built without live bind-mounts of source code,
# Nginx terminates TLS (bring your own certs into ./nginx/certs, or point a
# managed load balancer / certbot sidecar at this compose file).
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml exec backend php artisan migrate --force

networks:
  koperasi_net:
    driver: bridge

volumes:
  mysql_data:
  backend_storage:

services:
  mysql:
    image: mysql:8.0
    container_name: koperasi_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - koperasi_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    # No published port: only reachable from other containers on koperasi_net.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: koperasi_backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      APP_ENV: production
      APP_DEBUG: "false"
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - koperasi_net
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/vendor/autoload.php && php-fpm -t || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    container_name: koperasi_frontend
    restart: always
    depends_on:
      - backend
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    networks:
      - koperasi_net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: koperasi_nginx
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - backend_storage:/var/www/html/storage:ro
    networks:
      - koperasi_net
