# Production stack: images are built without live bind-mounts of source code,
# Nginx terminates TLS (bring your own certs into ./nginx/certs, or point a
# managed load balancer / certbot sidecar at this compose file).
#
# Usage:
#   bash scripts/setup.sh --file .env.production     # conf + generated secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# (MySQL here has NO published host port at all — it is only reachable from
# containers on the internal koperasi_net network.)
#
# The MySQL container auto-creates the database and loads the demo schema +
# seed data on the FIRST boot (empty volume) from ./mysql/init. Reset a used
# volume with: docker compose -f docker-compose.prod.yml exec -T mysql \
#   ... (see scripts/db-reset.sh)

networks:
  koperasi_net:
    driver: bridge

volumes:
  mysql_data:
  backend-dotnet-storage:

services:
  mysql:
    image: mysql:8.0
    container_name: koperasi_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-koperasi}
      MYSQL_USER: ${DB_USERNAME:-koperasi}
      MYSQL_PASSWORD: ${DB_PASSWORD:? must be set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:? must be set in .env}
    # Auto-seed: runs on the first boot of an EMPTY data volume only.
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - koperasi_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
    # No published port: only reachable from other containers on koperasi_net.

  # ---- .NET 10 backend (all API routes) ----
  backend-dotnet:
    build:
      context: ./backend-dotnet
      dockerfile: Dockerfile
    container_name: koperasi_backend_dotnet
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION_STRING: "server=mysql;port=3306;database=${DB_DATABASE:-koperasi};user=${DB_USERNAME:-koperasi};password=${DB_PASSWORD:? DB_PASSWORD must be set in .env};AllowPublicKeyRetrieval=false"
      JWT_KEY: ${JWT_KEY:? must be set in .env}
      JWT_ISSUER: ${APP_URL:-http://localhost}
      JWT_AUDIENCE: ${APP_URL:-http://localhost}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-1440}
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - backend-dotnet-storage:/app/backups
      # Uploaded images (avatars, item photos) persist across container
      # recreation and are served at /storage/*.
      - backend-dotnet-storage:/app/wwwroot/storage
    networks:
      - koperasi_net
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    container_name: koperasi_frontend
    restart: always
    depends_on:
      - backend-dotnet
    # NEXT_PUBLIC_API_BASE_URL is baked into the production image at build
    # time (build arg above), so no runtime env file is needed here.
    environment:
      NODE_ENV: production
    networks:
      - koperasi_net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: koperasi_nginx
    restart: always
    depends_on:
      backend-dotnet:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - koperasi_net
