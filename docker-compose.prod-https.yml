# TLS override for the production stack.
#
# Use alongside docker-compose.prod.yml when certificates exist:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod-https.yml \
#       --env-file .env.production up -d --build
#
# It swaps the HTTP-only nginx config (./nginx/prod.conf) for the TLS one
# (./nginx/prod-tls.conf) and publishes 443 in addition to APP_PORT.
# Certificates are expected at ./nginx/certs/fullchain.pem + privkey.pem —
# scripts/setup.sh can generate self-signed ones if you don't have real certs.
services:
  nginx:
    volumes:
      - ./nginx/prod-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${APP_PORT:-80}:80"
      - "${TLS_PORT:-443}:443"
