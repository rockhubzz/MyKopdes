# Local development stack.
# First run:  cp .env.example .env   (then edit values)
#             docker compose up -d --build
#
# The MySQL container auto-creates the database and loads the demo schema +
# seed data on the FIRST boot (empty volume) from ./mysql/init. To restore a
# used volume to that state later, run `scripts/db-reset.sh`.
#
# Services talk to each other over the internal "koperasi_net" network using
# their service names (mysql, backend-dotnet, frontend) as hostnames. Nginx is
# the only container that publishes a port to the host.
#
# API routes are served by the .NET 8 backend (backend-dotnet). The MySQL
# database, frontend, and nginx remain unchanged.

networks:
  koperasi_net:
    driver: bridge

volumes:
  mysql_data:
  backend-dotnet-storage:

services:
  mysql:
    image: mysql:8.0
    container_name: koperasi_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-koperasi}
      MYSQL_USER: ${DB_USERNAME:-koperasi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-koperasi_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${DB_FORWARD_PORT:-3306}:3306"
    # Auto-seed: runs on the first boot of an EMPTY data volume only.
    # The seed file matches the schema this stack actually runs on
    # (users/members/items/transactions/... plus loans) and the demo data.
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - koperasi_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- .NET 8 backend (all API routes) ----
  backend-dotnet:
    build:
      context: ./backend-dotnet
      dockerfile: Dockerfile
    container_name: koperasi_backend_dotnet
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION_STRING: "server=mysql;port=3306;database=${DB_DATABASE:-koperasi};user=${DB_USERNAME:-koperasi};password=${DB_PASSWORD:-koperasi_secret};SslMode=none;AllowPublicKeyRetrieval=true"
      JWT_KEY: ${JWT_KEY:-KoperasiSuperSecretKeyForJwtTokens2024!}
      JWT_ISSUER: ${APP_URL:-http://localhost}
      JWT_AUDIENCE: ${APP_URL:-http://localhost}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-1440}
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      - backend-dotnet-storage:/app/backups
      # Uploaded images (avatars, item photos) persist across container
      # recreation and are served at /storage/*.
      - backend-dotnet-storage:/app/wwwroot/storage
    networks:
      - koperasi_net
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    container_name: koperasi_frontend
    restart: unless-stopped
    depends_on:
      - backend-dotnet
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - koperasi_net
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    container_name: koperasi_nginx
    restart: unless-stopped
    depends_on:
      backend-dotnet:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - koperasi_net
