# Nginx reverse proxy for the MyKopdes stack.
# /api/*      -> .NET 8 backend (backend-dotnet, HTTP on port 80)
# /health     -> .NET 8 backend health check
# /storage/*  -> backend storage (uploads, avatars)
# everything else -> Next.js frontend (frontend)
#
# Hostnames are resolved at request time using a resolver variable to prevent
# nginx startup failures when containers aren't ready yet.

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Health check endpoint for the .NET backend
    location = /health {
        set $backend_dotnet_upstream http://backend-dotnet:80;
        proxy_pass $backend_dotnet_upstream/health;
        access_log off;
    }

    # Swagger UI + OpenAPI JSON from the .NET backend
    location /swagger {
        set $backend_dotnet_upstream http://backend-dotnet:80;
        proxy_pass $backend_dotnet_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes -> .NET 8 backend
    location /api/ {
        # Variable forces runtime DNS resolution (no emerg at startup).
        set $backend_dotnet_upstream http://backend-dotnet:80;
        proxy_pass $backend_dotnet_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
    }

    location = /api {
        return 308 /api/;
    }

    # User-uploaded images (item photos, avatars) — DB stores storage-relative
    # paths (e.g. avatars/x.png); the backend serves wwwroot/storage statically.
    location /storage {
        set $backend_dotnet_upstream http://backend-dotnet:80;
        proxy_pass $backend_dotnet_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # Next.js app (all staff + member UI, including websocket HMR in dev)
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
