# Local development reverse proxy.
# /api/*      -> Laravel (PHP-FPM via the backend container)
# everything  -> Next.js (frontend container)
#
# NOTE: hostnames are resolved at request time (via variables + the Docker
# embedded DNS at 127.0.0.11) instead of at startup. This prevents:
#   [emerg] host not found in upstream "backend" / "frontend"
# which crash-loops nginx whenever it starts before backend/frontend are
# resolvable.

# Docker embedded DNS. Must be in the server block context used below.
# (127.0.0.11 is always available on user-defined bridge networks.)

server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Laravel API.
    #
    # NOTE: the front-controller fallback goes to a *named* location.
    # try_files' "/index.php?..." fallback triggers an internal redirect,
    # and the new URI (/index.php) would no longer match this /api prefix
    # block — it would fall through to `location /` and get proxied to
    # Next.js (404). The named location runs php-fpm directly instead.
    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        # Only real files (there are none under /api today) are served
        # directly; everything else goes to Laravel's front controller.
        try_files $uri $uri/ @laravel_api;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            # Variable forces runtime DNS resolution (no emerg at startup).
            set $backend_upstream backend:9000;
            fastcgi_pass $backend_upstream;
            fastcgi_read_timeout 120;
        }
    }

    location @laravel_api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        # Variable forces runtime DNS resolution (no emerg at startup).
        set $backend_upstream backend:9000;
        fastcgi_pass $backend_upstream;
        fastcgi_read_timeout 120;
    }

    # Laravel storage (receipts, item images, exported reports)
    location /storage {
        alias /var/www/html/storage/app/public;
        autoindex off;
    }

    # Next.js app (all staff + member UI, including websocket HMR in dev)
    location / {
        # Variable forces runtime DNS resolution (no emerg at startup).
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
