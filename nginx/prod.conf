# Production reverse proxy — HTTP ONLY default.
#
# This is the docker-compose.prod.yml default so a fresh deployment boots
# WITHOUT certificates. For TLS, put fullchain.pem/privkey.pem into
# ./nginx/certs and start with the https override instead:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod-https.yml \
#       --env-file .env.production up -d --build
#
# The TLS variant (80 -> 443 redirect + HSTS) lives in ./nginx/prod-tls.conf;
# the only difference between the two files is that server listen block.
#
# /api/*      -> .NET 8 backend (backend-dotnet, HTTP on port 80)
# /health     -> .NET 8 backend health check
# /storage/*  -> backend storage (uploads, avatars)
# everything else -> Next.js frontend (frontend)

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Runtime DNS so nginx boots even if backend/frontend aren't resolvable yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Health check endpoint for the .NET backend
    location = /health {
        set $backend_dotnet_upstream http://backend-dotnet:80;
        proxy_pass $backend_dotnet_upstream/health;
        access_log off;
    }

    # Swagger is disabled in production (gated behind IsDevelopment in the
    # backend). This location is kept as a 404 rather than removed so that
    # any bookmarks or scanners get a clean rejection.
    location /swagger {
        return 404;
    }

    location = /api {
        return 308 /api/;
    }

    # API routes -> .NET 8 backend
    location /api/ {
        set $backend_dotnet_upstream http://backend-dotnet:80;
        proxy_pass $backend_dotnet_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
    }

    # User-uploaded images (item photos, avatars) — DB stores storage-relative
    # paths (e.g. avatars/x.png); the backend serves wwwroot/storage statically.
    location /storage {
        set $backend_dotnet_upstream http://backend-dotnet:80;
        proxy_pass $backend_dotnet_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
