# Production reverse proxy. Drop real certs into ./nginx/certs (or mount a
# volume from certbot / your platform's cert manager) and point
# ssl_certificate / ssl_certificate_key at them. Until certs exist, comment
# out the 443 server block and keep only the 80 block so the stack still
# boots.

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;
    # Redirect everything to HTTPS once certs are in place.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_HERE;
    client_max_body_size 20M;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Runtime DNS so nginx boots even if backend/frontend aren't resolvable yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        try_files $uri $uri/ @laravel_api;

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            set $backend_upstream backend:9000;
            fastcgi_pass $backend_upstream;
            fastcgi_read_timeout 120;
        }
    }

    location @laravel_api {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        set $backend_upstream backend:9000;
        fastcgi_pass $backend_upstream;
        fastcgi_read_timeout 120;
    }

    location /storage {
        alias /var/www/html/storage/app/public;
        autoindex off;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
