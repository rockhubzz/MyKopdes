# Production reverse proxy — TLS variant.
#
# Used when TLS is enabled: 80 redirects to 443 and serves the API/frontend
# over your certificates. Requires fullchain.pem + privkey.pem in
# ./nginx/certs (real certs, or self-signed ones generated by
# scripts/setup.sh).
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod-https.yml \
#       --env-file .env.production up -d --build
#
# /api/*      -> .NET 8 backend (backend-dotnet, HTTP on port 80)
# /health     -> .NET 8 backend health check
# /storage/*  -> backend storage (uploads, avatars)
# everything else -> Next.js frontend (frontend)

server {
    listen 443 ssl;      # nginx >= 1.25: "http2 on;" instead of "listen ... http2"
    http2 on;
    server_name _;
    client_max_body_size 20M;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    # 90 days; delete when running the "no-hsts" way with plain HTTP testing.
    add_header Strict-Transport-Security "max-age=7776000" always;
}

server {
    listen 80;
    server_name _;

    # ACME http-01 (optional — certbot style challenge path).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Runtime DNS so nginx boots even if backend/frontend aren't resolvable yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Health check endpoint for the .NET backend
    location = /health {
        set $backend_dotnet_upstream http://backend-dotnet:80;
        proxy_pass $backend_dotnet_upstream/health;
        access_log off;
    }

    # Swagger UI + OpenAPI JSON from the .NET backend
    location /swagger {
        set $backend_dotnet_upstream http://backend-dotnet:80;
        proxy_pass $backend_dotnet_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api {
        return 308 /api/;
    }

    # API routes -> .NET 8 backend
    location /api/ {
        set $backend_dotnet_upstream http://backend-dotnet:80;
        proxy_pass $backend_dotnet_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Upgrade $http_upgrade;
    }

    # User-uploaded images (item photos, avatars) — DB stores storage-relative
    # paths (e.g. avatars/x.png); the backend serves wwwroot/storage statically.
    location /storage {
        set $backend_dotnet_upstream http://backend-dotnet:80;
        proxy_pass $backend_dotnet_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
